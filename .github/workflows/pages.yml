name: pages

# Generate the static module-browser docs from this registry's modules/ tree and
# publish to GitHub Pages (https://tbzl.dev/). The registry JSON itself is served
# separately by CloudFront at https://registry.tbzl.dev/ (see tomato-bazel/infra).
on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "bazel_registry.json"
      - "tools/gen_docs.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generate module-browser site
        run: python3 tools/gen_docs.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Registry admission gating, as a ratchet.
#
# WHY THIS EXISTS. Nothing here ran on `pull_request` — ratchet.yml, report.yml
# and conformance.yml are all weekly cron — so a module version could be
# published and nothing looked at it until the following Monday, and then only
# as a report. That is how 135 findings accrued across 300-odd published
# versions: `rels release` computes the integrity itself and it was never
# re-verified. The cost showed up as reactive yanking (rules_cc_host 0.1.0,
# rules_lang 0.4.2) — both failures a graph invariant catches at publish time.
#
# WHY A RATCHET, NOT A GATE. The corpus is not green. Demanding zero before
# enforcing anything would mean enforcing nothing until a remediation campaign
# finishes, while more findings accrue — which is precisely how it got here.
# So this fails a PR only if it makes some invariant WORSE than the base.
# The registry stops getting worse today, and each invariant becomes a real
# `sparql_query_test` in tomato-bazel/gate the moment its count reaches zero.
#
# HOW. The gates live in tomato-bazel/gate: it projects a registry checkout to
# RDF and runs one SPARQL query per invariant, where a non-empty result set IS
# the counterexample. We project this PR and its base with the same pinned gate,
# then diff the per-gate counts.
name: conformance ratchet

on:
  # NO `paths:` FILTER, DELIBERATELY. Only a change to the registry contents can
  # move a counter, but a path-filtered workflow that does not match is SKIPPED,
  # and a skipped workflow never creates its check run at all. A branch
  # protection rule requiring this check would then sit on "Expected" for ever on
  # any PR that missed the filter — including, with some irony, the PR that
  # removed the filter. The filter now lives INSIDE the job (see `scope` below):
  # the check always reports, and a PR that touches nothing the gates can see
  # goes green in about five seconds instead of twelve minutes fifty.
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-ratchet-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # PINNED, not `main`. An unpinned gate means a change over there can turn
  # every PR here red without anyone touching this repo. Bump deliberately —
  # a bump that moves a counter will show up as a regression on its own PR,
  # which is the correct place to look at it.
  #
  # Bump in its OWN PR whenever the gate diff touches crates/**, gates/*.rq,
  # gates/declarations.ttl or vendor/bcr/** — those are the only four things that
  # can move a count. 3c17305..7d06b7b touches none of them: it adds
  # ENFORCED_ON_REGISTRY (S4 as a real sparql_query_test, which runs in gate's
  # own CI and is not in //gates:report's dependency closure) and refreshes
  # gate's committed projection, which the step below overwrites before anything
  # reads it. Provably a no-op for these counts, so it rides along here.
  GATE_REF: 7d06b7bfc153c78b8789a760359707fe9fab3f57

jobs:
  ratchet:
    # EXPLICIT, because this string verbatim IS the check-run name and therefore
    # the required-status-check context on main. Without it the check is named
    # after the job id — `ratchet` — which says nothing, and is the same job id
    # that ratchet.yml's weekly dep-ratchet already uses.
    name: gate conformance ratchet
    runs-on: ubuntu-latest
    steps:
      - name: Check out the registry (PR merge commit + base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The former `paths:` filter, as a step. `pull_request` checks out
      # refs/pull/N/merge, so base.sha..HEAD IS the PR's net diff — and it is the
      # same base.sha the worktree step below already relies on being present.
      #
      # The list is exactly the projector's input surface (see
      # gate/crates/bzlmod/src/registry.rs): bazel_registry.json and
      # modules/<name>/{metadata.json,<version>/{MODULE.bazel,source.json}}.
      # tools/rels/** is NOT in it, on purpose: rels writes into modules/, but a
      # PR that changes only rels leaves modules/ byte-identical, so both sides
      # project the same RDF and every count is unchanged by construction.
      # Guarding rels is a cargo test's job, not this one's.
      - name: Does this PR touch anything the gates project?
        id: scope
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          paths=(modules bazel_registry.json .github/workflows/gate-ratchet.yml)
          # `git diff --quiet` exits 1 when there IS a difference; a command in
          # an `if` condition is exempt from errexit, a bare call would not be.
          if git diff --quiet "$base" HEAD -- "${paths[@]}"; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No change under ${paths[*]} — nothing to project."
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            git diff --name-only "$base" HEAD -- "${paths[@]}"
          fi

      # Only on the short-circuit path, and only in its own step: gate-ratchet's
      # --summary does an fs::write, i.e. it TRUNCATES $GITHUB_STEP_SUMMARY, so
      # anything written before it ran would be silently discarded.
      - name: Summary — nothing to project
        if: steps.scope.outputs.relevant != 'true'
        run: |
          set -euo pipefail
          {
            echo '## Registry conformance'
            echo
            echo 'Not projected: this PR changes nothing the gates can see.'
            echo
            echo 'The projector reads `bazel_registry.json` and `modules/**` and'
            echo 'nothing else. This PR touches neither, so both sides of the'
            echo 'ratchet would produce byte-identical RDF and every per-gate'
            echo 'count would be unchanged — about 12m40s of Bazel to prove a'
            echo 'tautology.'
            echo
            echo "Base: \`${{ github.event.pull_request.base.sha }}\`"
            echo "Gate: \`${GATE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Two registry trees: what this PR proposes, and what main has today.
      # `git worktree` rather than a second clone so both come from the same
      # object store and the base is exactly the PR's merge base.
      - name: Materialise head and base registry trees
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/reg
          git worktree add /tmp/reg/head HEAD
          git worktree add /tmp/reg/base "${{ github.event.pull_request.base.sha }}"
          echo "head modules: $(ls /tmp/reg/head/modules | wc -l)"
          echo "base modules: $(ls /tmp/reg/base/modules | wc -l)"

      - name: Check out the gate
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/checkout@v4
        with:
          repository: tomato-bazel/gate
          ref: ${{ env.GATE_REF }}
          path: _gate

      # Guarding this one is not cosmetic: skipping a `uses:` step also skips its
      # post-step, which here is the ~22s cache save.
      - uses: bazel-contrib/setup-bazel@0.10.0
        if: steps.scope.outputs.relevant == 'true'
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # --vendor is load-bearing, not optional: without the vendored upstream
      # closure every third-party module resolves as a LEAF, MVS under-selects,
      # and the C-family gates only see atoms our own modules name directly.
      # --allow-unresolved because the registry legitimately contains an
      # unresolvable module (metadata.json with every version yanked) — that is
      # what S6 reports, not a reason to fail before we can report it.
      #
      # Both sides are projected by the SAME gate revision, so a difference in
      # the counts can only come from the registry contents.
      - name: Project and report — base, then head
        if: steps.scope.outputs.relevant == 'true'
        working-directory: _gate
        run: |
          set -euo pipefail
          for side in base head; do
            bazel run //crates/gate-rdf:project -- \
              "/tmp/reg/$side" "$PWD/gates/testdata/registry.ttl" \
              --vendor "$PWD/vendor/bcr" --allow-unresolved
            bazel build //gates:report
            cp bazel-bin/gates/report.binpb "/tmp/$side.binpb"
            chmod u+w "/tmp/$side.binpb"
          done

      - name: Ratchet
        if: steps.scope.outputs.relevant == 'true'
        working-directory: _gate
        run: |
          set -euo pipefail
          bazel run //crates/gate-report:gate-ratchet -- \
            --base /tmp/base.binpb \
            --head /tmp/head.binpb \
            --summary "$GITHUB_STEP_SUMMARY"
